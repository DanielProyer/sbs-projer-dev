name: sbs_projer_app
description: "SBS Projer - Service-Management App für Zapfanlagen-Service"
publish_to: 'none'
version: 0.72.11+664

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.0.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Lokale Datenbank (Offline)
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0
  fl_chart: ^0.69.0

  # Datum & Internationalisierung
  intl: any

  # PDF
  pdf: ^3.10.0
  printing: ^5.12.0
  barcode: ^2.2.9

  # Kamera & Bilder
  image_picker: ^1.0.0
  crop_your_image: ^2.0.0
  image: ^4.5.0

  # Datei-Auswahl
  file_picker: ^8.0.0

  # XML-Parsing (camt.053)
  xml: ^6.3.0

  # HTTP (für externe APIs)
  dio: ^5.4.0

  # Links (tel, mailto, https)
  url_launcher: ^6.2.0


  # Kalender
  table_calendar: ^3.1.0

  # Utilities
  uuid: ^4.3.0
  path_provider: ^2.1.0
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^6.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  shared_preferences: ^2.5.0

  # Karte & GPS (E3)
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
